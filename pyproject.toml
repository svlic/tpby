[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tpby"
version = "0.1.0"
description = "Telegram media routing, grouping, and blacklist service"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "telethon>=1.36,<2",
  "tzdata>=2024.1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "pytest-asyncio>=0.24,<1",
]

[project.scripts]
tpby = "tpby.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/tpby"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
